<div id="vortex-widget" style="padding: 20px; background: #2b1d3a; color: #fff; border-radius: 8px;">
    <h3 style="margin: 0 0 10px 0; color: #ff8c00; text-align: center;">🌪️ Où trouver la tornade?</h3>
    
    <!-- Sélecteur de serveur -->
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 15px;">
        <label for="server-select" style="font-size: 13px; color: #d1c4e9;">Mon serveur :</label>
        <select id="server-select" style="padding: 3px 6px; font-size: 13px; border-radius: 4px; background: #3d2654; color: #fff; border: 1px solid #ff8c00; cursor: pointer;">
            <optgroup label="France/Europe de l'Ouest">
                <option value="Europe/Paris" selected="">Blueberry Mountain</option>
                <option value="Europe/Paris">Diamond Island</option>
                <option value="Europe/Paris">Lavender Fields</option>
                <option value="Europe/Paris">Candy Factory</option>
                <option value="Europe/Paris">Frozen Fields</option>
                <option value="Europe/Paris">Pineapple Mountain</option>
                <option value="Europe/Paris">Spring Star</option>
            </optgroup>
            <optgroup label="Amérique du Nord">
                <option value="America/Toronto">Maple Star</option>
            </optgroup>
        </select>
    </div>

    <!-- Contenu dynamique -->
    <div id="vortex-container" style="background: #1e1329; padding: 15px; border-radius: 6px; border: 1px solid #4a2f6b;">
        Chargement de l'horaire...
    </div>
</div>

<script>
(function() {
    let globalVortexData = null;

    async function loadVortexData() {
        try {
            const response = await fetch('/web/content/1684');
            globalVortexData = await response.json();
            updateVortexDisplay();
        } catch (error) {
            console.error("Erreur de chargement JSON :", error);
            const container = document.getElementById('vortex-container');
            if (container) {
                container.innerHTML = "<p style='color: #ff6b6b;'>Impossible de charger l'horaire des tornades.</p>";
            }
        }
    }

    function updateVortexDisplay() {
        if (!globalVortexData) return;

        const serverSelect = document.getElementById('server-select');
        const container = document.getElementById('vortex-container');

        if (!serverSelect || !container) return;

        const tz = serverSelect.value;
        const now = new Date();

        // 1. Vérification de la date de fin (4 novembre 2026 à 00:00)
        const eventEndDate = new Date('2026-11-04T00:00:00');
        const currentDateInTz = new Date(now.toLocaleString('en-US', { timeZone: tz }));
        
        if (currentDateInTz >= eventEndDate) {
            container.innerHTML = `
                <div style="padding: 10px; color: #ffb74d;">
                    <span style="background: #c62828; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">ÉVÉNEMENT TERMINÉ</span>
                    <p style="margin: 12px 0 4px 0; font-size: 15px;">L'événement d'Halloween 2026 est maintenant terminé. Rendez-vous l'année prochaine !</p>
                </div>
            `;
            return;
        }

        // 2. Détection du jour et de l'heure dans le fuseau horaire
        const optionsDay = { timeZone: tz, weekday: 'long' };
        const optionsHour = { timeZone: tz, hour: 'numeric', hour12: false };
        
        let currentDayFr = new Intl.DateTimeFormat('fr-FR', optionsDay).format(now);
        currentDayFr = currentDayFr.charAt(0).toUpperCase() + currentDayFr.slice(1).toLowerCase();
        
        let currentHour = parseInt(new Intl.DateTimeFormat('en-US', optionsHour).format(now), 10);
        if (currentHour === 24) currentHour = 0;

        const daySchedule = globalVortexData[currentDayFr];

        if (!daySchedule) {
            container.innerHTML = `<p>Aucune donnée trouvée pour le jour : ${currentDayFr}</p>`;
            return;
        }

        // 3. Recherche de la tornade de l'heure actuelle
        const hourString = currentHour + ":00";
        const currentIndex = daySchedule.findIndex(item => item.hour === hourString);

        if (currentIndex === -1) {
            container.innerHTML = "<p>Les tornades ne sont pas actives en dehors de la plage horaire (7h - 23h).</p>";
            return;
        }

        const currentVortex = daySchedule[currentIndex];
        
        // 4. Prochaine tornade (gestion de la boucle de 23h vers 0h)
        let nextVortex;
        if (currentIndex < daySchedule.length - 1) {
            nextVortex = daySchedule[currentIndex + 1];
        } else {
            const daysOrder = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
            const currentDayIndex = daysOrder.indexOf(currentDayFr);
            const nextDayFr = daysOrder[(currentDayIndex + 1) % daysOrder.length];
            nextVortex = globalVortexData[nextDayFr][0];
        }

        // 5. Affichage
        container.innerHTML = `
            <!-- Tornade en cours -->
            <div style="margin-bottom: 15px; padding-bottom: 12px; border-bottom: 1px dashed #4a2f6b;">
                <span style="background: #e65100; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 18px; font-weight: bold;">TORNADE EN COURS</span>
                <p style="margin: 8px 0 4px 0; font-size: 16px;"><strong>${currentVortex.location}</strong></p>
                <p style="margin: 0; color: #ffb74d; font-size: 14px;">Horaire : ${currentVortex.hour} | Coordonnées : X: ${currentVortex.x}, Y: ${currentVortex.y}</p>
                <div style="text-align: right; margin-top: 4px;">
                    <a href="#je-ne-vois-pas-la-tornade" style="color: #b39ddb; font-size: 12px; text-decoration: underline;">Pourquoi je ne vois pas la tornade?</a>
                </div>
            </div>

            <!-- Prochaine tornade -->
            <div>
                <span style="background: #2e7d32; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 18px; font-weight: bold;">PROCHAINE TORNADE</span>
                <p style="margin: 8px 0 4px 0; font-size: 16px;"><strong>${nextVortex.location}</strong></p>
                <p style="margin: 0; color: #a5d6a7; font-size: 14px;">Horaire : ${nextVortex.hour} | Coordonnées : X: ${nextVortex.x}, Y: ${nextVortex.y}</p>
            </div>
        `;
    }

    // Initialisation sécurisée une fois le DOM prêt
    function initWidget() {
        const serverSelect = document.getElementById('server-select');
        if (serverSelect) {
            serverSelect.addEventListener('change', updateVortexDisplay);
        }
        loadVortexData();
        setInterval(updateVortexDisplay, 60000);    // Recherche relancée toutes les minutes
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initWidget);
    } else {
        initWidget();
    }
})();
</script>
